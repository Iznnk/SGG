<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGG - Recuperar Contraseña</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <main class="contenedor" id="mainContainer">
    <header class="top-bar">
      <div class="brand">
        <span class="logo-icon" aria-hidden="true">💳</span>
        <span class="version">v2.0</span>
      </div>
      <div class="controles">
        <button id="temaBtn" class="tema-btn" aria-label="Cambiar tema día/noche">🌙</button>
      </div>
    </header>

    <div class="header-titulos">
      <h1>SGG</h1>
      <h2>CAMBIO DE CONTRASEÑA</h2>
    </div>

    <form id="recuperarForm" novalidate>
      <div class="input-group">
        <label for="recEmail">Email Corporativo Registrado</label>
        <input type="email" id="recEmail" placeholder="usuario@empresa.com" required autocomplete="email">
      </div>

      <div class="input-group">
        <label for="recPassword">Nueva Contraseña</label>
        <div class="pass-wrapper">
          <input type="password" id="recPassword" placeholder="Ingrese su nueva contraseña" required autocomplete="new-password">
          <button type="button" class="btn-toggle-pass" data-target="recPassword" aria-label="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <!-- Feedback UX en Tiempo Real de los 5 Requisitos -->
      <ul class="feedback-reqs" id="feedbackReqsRec">
        <li id="reqLenRec" class="invalid">❌ Mínimo 8 caracteres</li>
        <li id="reqMayusRec" class="invalid">❌ Al menos 1 letra Mayúscula</li>
        <li id="reqMinusRec" class="invalid">❌ Al menos 1 letra Minúscula</li>
        <li id="reqNumRec" class="invalid">❌ Al menos 1 número (Dígito)</li>
        <li id="reqSymbolRec" class="invalid">❌ Al menos 1 carácter especial (!@#$%^&*)</li>
      </ul>

      <div class="input-group">
        <label for="recPasswordConfirm">Repetir Nueva Contraseña</label>
        <div class="pass-wrapper">
          <input type="password" id="recPasswordConfirm" placeholder="Repita la nueva contraseña" required autocomplete="new-password">
          <button type="button" class="btn-toggle-pass" data-target="recPasswordConfirm" aria-label="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <button type="submit" id="btnRecuperar" disabled>Actualizar Contraseña</button>
    </form>

    <p id="mensaje" role="alert" aria-live="polite"></p>

    <nav class="links-navegacion" aria-label="Navegación de retorno">
      <a href="index.html" class="nav-link">← Volver al Inicio de Sesión</a>
    </nav>

    <footer>SGG © 2026 - Uso Corporativo</footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
