<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGG - Recuperar Contraseña</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <main class="contenedor" id="mainContainer">
    <header class="top-bar">
      <div class="brand">
        <span class="logo-icon" aria-hidden="true">💳</span>
        <span class="version">v2.0</span>
      </div>
      <div class="controles">
        <select id="langSelect" class="lang-select" aria-label="Seleccionar idioma">
          <option value="es">🇪🇸 Español</option>
          <option value="en">🇺🇸 English</option>
          <option value="pt">🇧🇷 Português</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ar">🇸🇦 العربية</option>
        </select>
        <button id="temaBtn" class="tema-btn" aria-label="Cambiar tema día/noche">🌙</button>
      </div>
    </header>

    <div class="header-titulos">
      <h1>SGG</h1>
      <h2 id="titleRecuperar" data-i18n="titleRecuperar">CAMBIO DE CONTRASEÑA</h2>
    </div>

    <form id="recuperarForm" novalidate>
      <div class="input-group">
        <label for="recEmail" data-i18n="lblRecEmail">Email Corporativo Registrado</label>
        <input type="email" id="recEmail" placeholder="usuario@empresa.com" required autocomplete="email">
      </div>

      <div class="input-group">
        <label for="recPassword" data-i18n="lblNewPass">Nueva Contraseña</label>
        <div class="pass-wrapper">
          <input type="password" id="recPassword" placeholder="Ingrese su nueva contraseña" required autocomplete="new-password">
          <button type="button" class="btn-toggle-pass" data-target="recPassword" aria-label="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <ul class="feedback-reqs" id="feedbackReqsRec">
        <li id="reqLenRec" class="invalid" data-i18n="reqLen">❌ Mínimo 8 caracteres</li>
        <li id="reqMayusRec" class="invalid" data-i18n="reqMayus">❌ Al menos 1 letra Mayúscula</li>
        <li id="reqMinusRec" class="invalid" data-i18n="reqMinus">❌ Al menos 1 letra Minúscula</li>
        <li id="reqNumRec" class="invalid" data-i18n="reqNum">❌ Al menos 1 número (Dígito)</li>
        <li id="reqSymbolRec" class="invalid" data-i18n="reqSymbol">❌ Al menos 1 carácter especial (!@#$%^&*)</li>
      </ul>

      <div class="input-group">
        <label for="recPasswordConfirm" data-i18n="lblConfirmPass">Repetir Contraseña</label>
        <div class="pass-wrapper">
          <input type="password" id="recPasswordConfirm" placeholder="Repita la nueva contraseña" required autocomplete="new-password">
          <button type="button" class="btn-toggle-pass" data-target="recPasswordConfirm" aria-label="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <button type="submit" id="btnRecuperar" disabled data-i18n="btnUpdatePass">Actualizar Contraseña</button>
    </form>

    <p id="mensaje" role="alert" aria-live="polite"></p>

    <nav class="links-navegacion" aria-label="Navegación de retorno">
      <a href="index.html" class="nav-link" data-i18n="linkBack">← Volver al Inicio de Sesión</a>
    </nav>

    <footer data-i18n="usoCorporativo">SGG © 2026 - Uso Corporativo</footer>
  </main>

  <script src="js/lang/es.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/pt.js"></script>
  <script src="js/lang/fr.js"></script>
  <script src="js/lang/it.js"></script>
  <script src="js/lang/de.js"></script>
  <script src="js/lang/ru.js"></script>
  <script src="js/lang/zh.js"></script>
  <script src="js/lang/ja.js"></script>
  <script src="js/lang/ar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
