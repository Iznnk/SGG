<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGG - Dashboard de Gastos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <main class="contenedor modo-dashboard" id="mainContainer">
    <header class="top-bar">
      <div class="brand">
        <span class="logo-icon" aria-hidden="true">💳</span>
        <span class="version">v2.0</span>
      </div>
      <div class="controles">
        <select id="langSelect" class="lang-select" aria-label="Seleccionar idioma">
          <option value="es">🇪🇸 Español</option>
          <option value="en">🇺🇸 English</option>
          <option value="pt">🇧🇷 Português</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ar">🇸🇦 العربية</option>
        </select>
        <button id="temaBtn" class="tema-btn" aria-label="Cambiar tema día/noche">🌙</button>
      </div>
    </header>

    <div class="dashboard-nav">
      <div>
        <h1 style="font-size: 1.5rem; color: var(--neon-accent);">SGG</h1>
        <p style="font-size: 0.85rem; color: var(--text-sec);"><span data-i18n="lblBienvenido">Bienvenido</span>, <strong id="userNombre">Usuario</strong></p>
      </div>
      <button id="btnCerrarSesion" class="btn-logout" data-i18n="btnCerrarSesion">Cerrar Sesión</button>
    </div>

    <!-- RF-09: PANEL DE RESUMEN -->
    <section class="panel-resumen" aria-labelledby="lblTotalGastado">
      <h2 id="lblTotalGastado" data-i18n="lblTotalGastado">TOTAL GASTADO (REGISTROS ACTIVOS)</h2>
      <div id="totalGastado" class="monto-total">$0.00</div>
    </section>

    <!-- RF-05 / RF-07: FORMULARIO DE CARGA Y EDICIÓN -->
    <section class="panel-modulo">
      <h2 class="modulo-titulo" id="formTitulo" data-i18n="lblCargarGasto">REGISTRAR NUEVO GASTO</h2>
      <form id="gastoForm" novalidate>
        <input type="hidden" id="gastoId">
        
        <div class="grid-inputs">
          <div class="input-group">
            <label for="monto" data-i18n="lblMonto">Monto ($)</label>
            <input type="number" id="monto" min="0.01" step="0.01" required placeholder="0.00">
          </div>

          <div class="input-group">
            <label for="fecha" data-i18n="lblFecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>

          <div class="input-group">
            <label for="categoria" data-i18n="lblCategoria">Categoría</label>
            <select id="categoria" required>
              <option value="" disabled selected data-i18n="optSeleccionar">Seleccionar...</option>
              <option value="Alimentación" data-i18n="catAlimentacion">Alimentación</option>
              <option value="Transporte" data-i18n="catTransporte">Transporte</option>
              <option value="Servicios" data-i18n="catServicios">Servicios</option>
              <option value="Ocio" data-i18n="catOcio">Ocio</option>
              <option value="Salud" data-i18n="catSalud">Salud</option>
              <option value="Otros" data-i18n="catOtros">Otros</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="descripcion" data-i18n="lblDescripcion">Descripción</label>
          <input type="text" id="descripcion" data-i18n-ph="phDescripcion" placeholder="Detalle del gasto..." required>
        </div>

        <div class="form-botones">
          <button type="submit" id="btnGuardarGasto" data-i18n="btnGuardarGasto">Guardar Gasto</button>
          <button type="button" id="btnCancelarEdicion" class="btn-cancelar" style="display: none;" data-i18n="btnCancelarEdicion">Cancelar Edición</button>
        </div>
      </form>
    </section>

    <!-- RF-06: HISTORIAL DINÁMICO -->
    <section class="panel-modulo">
      <h2 class="modulo-titulo" data-i18n="lblHistorial">HISTORIAL DE GASTOS</h2>
      <div class="tabla-container">
        <table class="tabla-gastos">
          <thead>
            <tr>
              <th data-i18n="thFecha">Fecha</th>
              <th data-i18n="thCategoria">Categoría</th>
              <th data-i18n="thDescripcion">Descripción</th>
              <th data-i18n="thMonto">Monto</th>
              <th data-i18n="thAcciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaGastosBody"></tbody>
        </table>
      </div>
    </section>

    <p id="mensajeGasto" role="alert" aria-live="polite"></p>
    <footer data-i18n="usoCorporativo">SGG © 2026 - Uso Corporativo</footer>
  </main>

  <!-- MODAL DE BAJA LÓGICA (RF-08) -->
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <h3 id="modalTitle" data-i18n="modalTitulo">¿Confirmar Eliminación?</h3>
      <p data-i18n="modalTexto">Esta acción inactivará el gasto seleccionado. ¿Desea continuar?</p>
      <div class="modal-botones">
        <button id="btnConfirmBorrar" class="btn-eliminar" data-i18n="btnBorrar">Eliminar</button>
        <button id="btnCancelarBorrar" class="btn-cancelar" data-i18n="btnCancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="js/lang/es.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/pt.js"></script>
  <script src="js/lang/fr.js"></script>
  <script src="js/lang/it.js"></script>
  <script src="js/lang/de.js"></script>
  <script src="js/lang/ru.js"></script>
  <script src="js/lang/zh.js"></script>
  <script src="js/lang/ja.js"></script>
  <script src="js/lang/ar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gastos.js"></script>
</body>
</html>
